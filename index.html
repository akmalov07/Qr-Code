<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Qr Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <div class="container">
        <h2 class="generation">QR Code Generators</h2>

        <form action="" class="qr-code-form">
            <input type="text" class="qr-code-input">
            <button type="submit" class="qr-code-btn">Create QR Code</button>

            <div class="qr-code-show"></div>

            <div class="div-color">
                <div>
                    <h3>QR Code fon rangi:</h3>
                    <input type="color" class="color-qr" value="#000000">
                </div>
                <div>
                    <h3>QR Code rangi:</h3>
                    <input type="color" class="color-qr1" value="#ffffff">
                </div>
            </div>
        </form>
    </div>







    <script src="./app.js"></script>
</body>

</html>
